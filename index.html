<style>
  :root{
    --bg: #17130F;
    --surface: #201A14;
    --surface-2: #2A2219;
    --line: #3C3226;
    --ink: #F2EAD9;
    --ink-dim: #A7987E;
    --ember: #E8722F;
    --ember-ink: #1A1108;
    --ember-deep: #C2571C;
    --danger: #C4553C;
    --shadow: rgba(0,0,0,0.4);
  }
  :root[data-theme="light"]{
    --bg: #F5EFE2;
    --surface: #FFFFFF;
    --surface-2: #EDE4D2;
    --line: #DCCFB2;
    --ink: #23190F;
    --ink-dim: #7C6C51;
    --ember: #CB5A22;
    --ember-ink: #FFF8EE;
    --ember-deep: #A9481A;
    --danger: #A9432C;
    --shadow: rgba(35,25,15,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    font-size: 14px;
    line-height: 1.3;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  button{font-family:inherit;}
  ::selection{ background: var(--ember); color: var(--ember-ink); }

  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: calc(12px + env(safe-area-inset-top)) 18px 8px;
    background: var(--bg);
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 30;
  }
  .brand-line{ display:flex; align-items:baseline; gap:6px; }
  .brand-type{
    font-size: 10px; font-weight: 700; color: var(--ember);
    letter-spacing: 0.04em;
  }
  .brand-name{ font-weight: 900; font-size: 18px; letter-spacing: 0.01em; }
  .brand-sub{ color: var(--ink-dim); font-size: 11px; margin-top: 1px; }
  .theme-toggle{
    background: var(--surface-2); border: none; color: var(--ink);
    border-radius: 999px; width: 34px; height: 34px; font-size: 15px;
    display:flex; align-items:center; justify-content:center; flex-shrink: 0;
  }

  .sticky-head{
    position: fixed; top: 75px; left: 0; right: 0; z-index: 20;
    background: var(--bg);
  }
  .toolbar{
    padding: 0 18px 4px;
  }
  .quick-add{
    background: var(--surface); border: 1px solid var(--ember);
    border-radius: 10px; padding: 5px 8px; margin-bottom: 6px;
  }
  .quick-add-label-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 3px;
  }
  .quick-add-label{
    font-size: 10px; font-weight: 700; color: var(--ember);
  }
  .quick-add-form{ display:flex; gap:4px; }
  .quick-add-form input{
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 5px 8px; font-size: 16px; font-family: inherit; min-width:0;
  }
  .quick-add-form input:first-child{ flex: 1.2; }
  .quick-add-form input:last-of-type{ flex: 0.8; }
  .quick-add-form input::placeholder{ color: var(--ink-dim); }
  .quick-add-form button{
    background: var(--ember); color: var(--ember-ink); border: none; border-radius: 8px;
    padding: 0 10px; font-weight: 700; font-size: 11px; flex-shrink: 0; height: 30px;
  }
  .quick-add .custom-error{ margin-top: 2px; margin-bottom: 0; font-size: 11px; }

  .tax-switch{
    display:flex; align-items:center; gap:7px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 5px 4px 10px;
    font-size: 11.5px; color: var(--ink-dim);
  }
  .tax-switch .track{
    position:relative; width:34px; height:19px;
    background: var(--surface-2); border-radius: 999px; flex-shrink:0;
  }
  .tax-switch .knob{
    position:absolute; top:2px; left:2px; width:15px; height:15px;
    border-radius:50%; background: var(--ink-dim);
    transition: transform .18s ease, background .18s ease;
  }
  .tax-switch[aria-pressed="true"] .knob{ transform: translateX(15px); background: var(--ember); }
  .tax-switch b{ color: var(--ink); font-weight:700; }
  .tax-switch-mini{
    padding: 5px 9px 5px 8px; flex-shrink: 0;
  }
  .reset-link{
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 999px; padding: 4px 10px; font-size: 10.5px; white-space: nowrap;
  }

  .cat-tabs{
    display:flex; gap:7px; overflow-x:auto;
    padding: 2px 18px 7px; background: var(--bg);
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex-shrink:0; background: var(--surface); border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 999px; padding: 5px 12px;
    font-size: 12px; font-weight: 500; display:flex; align-items:center; gap:6px;
  }
  .cat-tab.active{
    background: var(--ember); border-color: var(--ember); color: var(--ember-ink);
  }
  .cat-tab .n{
    background: rgba(0,0,0,0.18); border-radius: 999px; font-size: 10px;
    padding: 1px 6px; line-height: 1.5;
  }
  .cat-tab.active .n{ background: rgba(0,0,0,0.22); }

  main{ margin-top: 122px; padding: 2px 18px 0; }
  .cat-section{ scroll-margin-top: 122px; margin-top: 14px; padding-top: 10px; }
  .cat-section:first-child{ margin-top: 0; padding-top: 0; }
  .cat-heading{ font-weight: 700; font-size: 13px; padding: 0 2px 5px; color: var(--ink-dim); }
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    padding: 8px 2px 8px 8px; border-bottom: 1px solid var(--line); min-height: 38px;
    border-left: 3px solid transparent;
  }
  .item-row.price-tint-0{ border-left-color: #E0A458; }
  .item-row.price-tint-1{ border-left-color: #7FA8C9; }
  .item-row.price-tint-2{ border-left-color: #8CB369; }
  .item-row.price-tint-3{ border-left-color: #B98BC9; }
  .item-row.price-tint-4{ border-left-color: #D97D7D; }
  .item-row.has-qty .item-name{ color: var(--ember); }
  .item-name{ font-family: "M PLUS Rounded 1c", "Hiragino Sans", sans-serif; font-size: 15px; font-weight: 700; display:block; }
  .item-price{
    font-size: 13px; font-weight: 600; color: var(--ink-dim); font-variant-numeric: tabular-nums;
    display:block; margin-top: 2px;
  }
  .stepper{
    display:flex; align-items:center; gap: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; flex-shrink: 0;
  }
  .stepper button{
    width: 42px; height: 42px; background: transparent; border: none;
    color: var(--ink); font-size: 21px; display:flex; align-items:center; justify-content:center;
  }
  .stepper button:disabled{ opacity: 0.3; }
  .stepper .qty{
    min-width: 24px; text-align:center; font-weight: 700;
    font-variant-numeric: tabular-nums; font-size: 15.5px;
  }
  .item-row.has-qty .stepper{ border-color: var(--ember); }

  .empty-note{ color: var(--ink-dim); font-size: 14px; padding: 40px 4px; text-align:center; }

  .custom-section{ padding: 6px 2px 20px; border-bottom: 2px solid var(--line); margin-bottom: 4px; }
  .custom-error{ color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 0; }

  .item-name-wrap{ flex:1; cursor:pointer; }
  .item-row-editing{ flex-direction:column; align-items:stretch; gap:6px; padding: 9px 2px; }
  .edit-form{ display:flex; gap:8px; }
  .edit-form input{
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);

<header>
  <div>
    <div class="brand-line">

  </div>
  <div class="header-actions">
    <button class="icon-btn" id="historyBtn" aria-label="会計履歴">🕘</button>
    <button class="icon-btn" id="exportBtn" aria-label="商品データをバックアップ">⬇️</button>
    <button class="icon-btn" id="importBtn" aria-label="商品データを復元">⬆️</button>
    <button class="theme-toggle" id="themeToggle" aria-label="表示切り替え">🌙</button>
  </div>
</header>

<div class="sticky-head">
  <div class="toolbar">
    <div class="quick-add">
      <div class="quick-add-label-row">
        <span class="quick-add-label">本日のおすすめ</span>
      </div>
      <div class="quick-add-form">
        <input id="customName" type="text" placeholder="メニュー名" autocomplete="off">
        <input id="customPrice" type="number" inputmode="numeric" placeholder="値段" autocomplete="off">
        <button type="button" id="customAddBtn">追加</button>
      </div>
      <div class="custom-error" id="customError"></div>
    </div>
  </div>

  <nav class="cat-tabs" id="catTabs"></nav>
</div>

<main id="menuRoot"></main>

<div class="bill-bar">
  <div class="bill-info">
    <span class="bill-count" id="billCount">0点</span>
    <span class="bill-amount" id="billAmount">¥0</span>
  </div>
  <button class="tax-switch tax-switch-mini" id="taxSwitch" aria-pressed="true">
    <span class="track"><span class="knob"></span></span>
    <b id="taxLabel">税込</b>
  </button>
  <button class="bill-open" id="openReceipt">明細を見る</button>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="receipt" id="receipt">
  <div class="receipt-head">
    <h2>ご注文明細</h2>
    <button class="receipt-close" id="closeReceipt" aria-label="閉じる">×</button>
  </div>
  <div class="receipt-body" id="receiptBody"></div>
  <div class="split-row">
    <span class="split-label">割り勘</span>
    <div class="split-stepper">
      <button type="button" id="splitMinus" aria-label="人数を減らす">−</button>
      <span class="split-count" id="splitCount">1</span>
      <button type="button" id="splitPlus" aria-label="人数を増やす">＋</button>
      <span class="split-unit">人</span>
    </div>
    <span class="split-amount" id="splitAmount">¥0 / 人</span>
  </div>
  <div class="pay-row">
    <span class="pay-label">お預かり</span>
    <input type="number" inputmode="numeric" id="receivedInput" placeholder="金額" class="pay-input">
    <span class="pay-change" id="changeDisplay">お釣り —</span>
  </div>
  <div class="receipt-foot">
    <div class="receipt-total-block">
      <div class="receipt-total-label">合計</div>
      <div class="receipt-total-row">
        <div class="receipt-total" id="receiptTotal">¥0</div>
        <button type="button" class="total-edit-btn" id="totalEditBtn" aria-label="合計金額を編集">✎</button>
      </div>
      <div class="receipt-total-note" id="receiptTotalNote"></div>
      <div class="total-edit-form" id="totalEditForm" style="display:none;">
        <input type="number" inputmode="numeric" id="totalEditInput" placeholder="金額を入力">
        <button type="button" id="totalEditSave">保存</button>
        <button type="button" id="totalEditCancel">キャンセル</button>
      </div>
    </div>
    <button class="receipt-reset" id="resetBtnBottom">記録してリセット</button>
  </div>
</div>

<div class="receipt" id="historyPanel">
  <div class="receipt-head">
    <h2>会計履歴</h2>
    <button class="receipt-close" id="closeHistory" aria-label="閉じる">×</button>
  </div>
  <div class="receipt-body" id="historyBody"></div>
  <div class="receipt-foot" style="justify-content:flex-end;">
    <button class="receipt-reset" id="clearHistoryBtn">履歴を全て削除</button>
  </div>
</div>

<div class="receipt" id="importPanel">
  <div class="receipt-head">
    <h2 id="importPanelTitle">商品データを復元</h2>
    <button class="receipt-close" id="closeImport" aria-label="閉じる">×</button>
  </div>
  <div class="receipt-body">
    <p class="import-hint" id="importHint">バックアップしたテキストを、下に貼り付けてください。</p>

  </div>
  <div class="receipt-foot" style="justify-content:flex-end;">
    <button class="receipt-reset" id="importSubmitBtn">復元する</button>
  </div>
</div>

<script>
(function(){

  var NO_TINT_CATS = ["ポテサラ・煮込み","ハイボール","サワー・チューハイ","日本酒・ワイン","焼酎","ビール","その他お酒","ソフトドリンク"];

      {n:"やっこ",p:250},{n:"塩辛",p:250},{n:"なめ茸おろし",p:250},

      {n:"煮込み",p:500},{n:"煮込み（ハーフ）",p:380},

    { cat: "ハイボール", items: [

      {n:"暖流ハイボール（泡盛「暖流」）",p:730},

      {n:"氷結無糖レモン（中）",p:450},{n:"氷結無糖レモン（大）",p:880},
      {n:"ホッピーセット（白・黒）",p:530},{n:"ホッピー（なか）",p:300},{n:"ホッピー（そと）",p:330},
      {n:"強炭酸チューハイ",p:450},
      {n:"（トッピング）梅干し",p:100},{n:"（トッピング）生レモン",p:200},{n:"（トッピング）生グレープフルーツ",p:200},
      {n:"緑茶ハイ",p:500},{n:"烏龍茶ハイ",p:500},{n:"コーン茶ハイ",p:500},
      {n:"豆乳ハイ",p:500},{n:"トマトハイ",p:500},
      {n:"サイダーサワー",p:500},{n:"レモンサワー",p:500},{n:"バイスサワー",p:500},{n:"クエン酸サワー",p:500}

    { cat: "日本酒・ワイン", items: [
      {n:"からくち一品（小）",p:450},{n:"からくち一品（大）",p:830},

    ]},
    { cat: "焼酎", items: [

      {n:"きろく（芋）",p:580},{n:"中々（麦）",p:580},
      {n:"明るい農村（芋）",p:630},{n:"兼八（麦）",p:630},
      {n:"暖流（泡盛）",p:730}
    ]},
    { cat: "ビール", items: [
      {n:"生ビール ハートランド",p:680},{n:"サッポロラガー（大瓶）",p:630},
      {n:"レッドアイ",p:680},{n:"ノンアルコールビール",p:480}
    ]},
    { cat: "その他お酒", items: [
      {n:"梅酒",p:580},{n:"ゆず酒",p:630}
    ]},
    { cat: "ソフトドリンク", items: [
      {n:"強炭酸水",p:300},
      {n:"緑茶",p:400},{n:"烏龍茶",p:400},{n:"コーン茶",p:400},{n:"豆乳",p:400},
      {n:"トマトジュース",p:400},{n:"オレンジジュース",p:400},{n:"コーラ",p:400}
    ]}
  ];

  var idx = 0;
  defaultMenuData.forEach(function(cat, ci){
    cat.id = "cat-" + ci;
    cat.items.forEach(function(it){ it.id = "i" + (idx++); });
  });

  var MASTER_KEY = "okanjo-master-v1";
  var masterData;

  (function initMaster(){
    try{
      var raw = localStorage.getItem(MASTER_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length > 0){
          masterData = parsed;
          migrateCategoryNames();
          return;
        }
      }
    }catch(e){ /* fall through to seed */ }

    // First run (or corrupted master data): seed from the built-in menu.
    // Also pull in anything already registered under the previous
    // (pre-master) storage format so nothing gets lost in the upgrade.
    var seeded = JSON.parse(JSON.stringify(defaultMenuData));
    var legacyItems = [];
    try{
      var oldRaw = localStorage.getItem("okanjo-state-v2");
      if(oldRaw){
        var oldParsed = JSON.parse(oldRaw);
        if(oldParsed && Array.isArray(oldParsed.custom)){
          legacyItems = oldParsed.custom.map(function(it){
            return { id: it.id, n: it.n, p: it.p };
          });
        }
      }
    }catch(e){ /* ignore */ }
    seeded.unshift({ id: "osusume", cat: "本日のおすすめ", items: legacyItems });
    masterData = seeded;
    saveMaster();
  })();

  // One-off migration for people who already have saved menu data from
  // before 日本酒/ワイン were merged. Keeps any edits/additions they
  // made under the old category names. その他お酒 was briefly renamed
  // to その他飲み物 and then reverted, so also migrate that back.
  function migrateCategoryNames(){
    var changed = false;
    var nihonshu = null, wine = null, otherDrink = null;
    for(var i = 0; i < masterData.length; i++){
      if(masterData[i].cat === "日本酒") nihonshu = masterData[i];
      if(masterData[i].cat === "ワイン") wine = masterData[i];
      if(masterData[i].cat === "その他飲み物") otherDrink = masterData[i];
    }
    if(nihonshu && wine){
      nihonshu.cat = "日本酒・ワイン";
      nihonshu.id = nihonshu.id || "nihonshu-wine";
      nihonshu.items = nihonshu.items.concat(wine.items);
      masterData = masterData.filter(function(c){ return c !== wine; });
      changed = true;
    }
    if(otherDrink){
      otherDrink.cat = "その他お酒";
      changed = true;
    }
    masterData.forEach(function(c){
      c.items.forEach(function(it){
        if(it.n === "豚バラ（茨城麒麟豚使用）"){
          it.n = "豚バラ（茨城銘柄豚使用）";
          changed = true;
        }
      });
    });
    if(changed) saveMaster();
  }

  function saveMaster(){
    try{ localStorage.setItem(MASTER_KEY, JSON.stringify(masterData)); }catch(e){ /* ignore */ }
  }

  function findCategory(catId){
    for(var i = 0; i < masterData.length; i++){
      if(masterData[i].id === catId) return masterData[i];
    }
    return null;
  }

  function updateItem(catId, itemId, name, price){
    var cat = findCategory(catId);
    if(!cat) return;
    var item = null;
    for(var i = 0; i < cat.items.length; i++){
      if(cat.items[i].id === itemId){ item = cat.items[i]; break; }
    }
    if(!item) return;
    item.n = name;
    item.p = price;
    saveMaster();
    editingId = null;
    render();
  }

  function removeItem(catId, itemId){
    var cat = findCategory(catId);
    if(!cat) return;
    cat.items = cat.items.filter(function(it){ return it.id !== itemId; });
    delete state.qty[itemId];
    saveMaster();
    saveState();
    editingId = null;
    render();
  }

  function addItemToOsusume(name, price){
    var cat = findCategory("osusume");
    if(!cat) return null;
    var id = "m" + Date.now() + Math.floor(Math.random() * 1000);
    cat.items.push({ id: id, n: name, p: price });
    saveMaster();
    return id;
  }

    toast.className = "app-toast";

    setTimeout(function(){ toast.classList.add("show"); }, 10);

  async function exportMaster(){
    var dataStr = JSON.stringify(masterData, null, 2);
    var stamp = new Date().toISOString().slice(0, 10);
    try{
      if(window.claude && window.claude.use){
        var downloads = await window.claude.use("downloads");
        if(downloads){
          await downloads.save({ filename: "maruichi-menu-" + stamp + ".json", data: dataStr });
          showToast("バックアップを保存しました");
          return;
        }
      }
    }catch(e){ /* not running inside the Claude artifact sandbox: fall through */ }

    // Outside the artifact sandbox (a normal deployed site), a plain
    // browser download works fine, unlike inside the sandboxed iframe.
    try{
      var blob = new Blob([dataStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "maruichi-menu-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("バックアップを保存しました");
      return;
    }catch(e){ /* fall through to manual-copy fallback */ }

    openExportFallback(dataStr);
  }

  function importMasterFromText(text){
    try{
      var parsed = JSON.parse(text);
      if(!Array.isArray(parsed) || parsed.length === 0) throw new Error("invalid");
      var idx2 = 0;
      parsed.forEach(function(cat, ci){
        if(typeof cat.cat !== "string" || !Array.isArray(cat.items)) throw new Error("invalid");
        if(!cat.id) cat.id = "cat-" + ci;
        cat.items.forEach(function(it){
          if(typeof it.n !== "string" || typeof it.p !== "number") throw new Error("invalid");
          if(!it.id) it.id = "i" + (idx2++);
        });
      });
      masterData = parsed;
      saveMaster();
      render();
      closePanel();
      showToast("商品データを復元しました");
    }catch(e){
      showToast("貼り付けた内容の形式が正しくありません");
    }
  }

  function loadState(){

        if(parsed && typeof parsed === "object"){
          state.qty = parsed.qty || {};
          state.taxIncl = typeof parsed.taxIncl === "boolean" ? parsed.taxIncl : true;
          state.theme = parsed.theme === "dark" ? "dark" : "light";

          state.manualTotal = (typeof parsed.manualTotal === "number" && parsed.manualTotal >= 0) ? parsed.manualTotal : null;
        }
      }
    }catch(e){ /* storage unavailable: continue with defaults */ }

      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist();
      }
    }catch(e){ /* not supported: continue */ }
  }

  var currentSectionIds = [];
  var scrollTicking = false;
  var suppressScrollUpdates = false;
  var suppressTimer = null;

  function scrollToSection(id){
    var el = document.getElementById(id);
    if(!el) return;
    var headerEl = document.querySelector("header");
    var head = document.querySelector(".sticky-head");
    var headerH = headerEl ? headerEl.getBoundingClientRect().height : 0;
    var headH = headerH + (head ? head.getBoundingClientRect().height : 0);
    var y = el.getBoundingClientRect().top + window.pageYOffset - headH - 8;

    // While the tap-triggered smooth scroll is animating past other
    // categories, ignore scroll-driven highlight updates so the tab bar
    // doesn't flicker through every section it passes on the way.
    suppressScrollUpdates = true;
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(function(){ suppressScrollUpdates = false; }, 700);

    window.scrollTo({ top: Math.max(y, 0), behavior: "smooth" });
    setActiveTab(id);
  }

  function setActiveTab(id){
    Array.prototype.forEach.call(catTabs.querySelectorAll(".cat-tab"), function(t){
      t.classList.toggle("active", t.dataset.target === id);
    });
  }

  function buildTabs(visibleCats){
    catTabs.innerHTML = "";

    visibleCats.forEach(function(cat){
      var count = cat.items.reduce(function(sum, it){ return sum + (state.qty[it.id] || 0); }, 0);
      var tab = document.createElement("button");
      tab.type = "button";
      tab.className = "cat-tab";
      tab.dataset.target = cat.id;
      tab.innerHTML = esc(cat.cat) + (count > 0 ? ' <span class="n">' + count + '</span>' : '');
      tab.addEventListener("click", function(){
        scrollToSection(cat.id);
      });
      catTabs.appendChild(tab);
    });
  }

  // Determine which category is "current" by finding the last section
  // whose top has scrolled up past the sticky header. This looks directly
  // at real scroll position instead of guessing from overlap detection,
  // so it can't mistake a neighboring section for the one in view.
  function updateActiveFromScroll(){
    if(currentSectionIds.length === 0) return;
    var headerEl = document.querySelector("header");
    var head = document.querySelector(".sticky-head");
    var headerH = headerEl ? headerEl.getBoundingClientRect().height : 0;
    var headH = headerH + (head ? head.getBoundingClientRect().height : 0);
    var threshold = headH + 20;
    var activeId = null;
    for(var i = 0; i < currentSectionIds.length; i++){
      var el = document.getElementById(currentSectionIds[i]);
      if(!el) continue;
      if(el.getBoundingClientRect().top <= threshold){
        activeId = currentSectionIds[i];
      } else {
        break;
      }
    }
    setActiveTab(activeId);
  }

  function onScroll(){
    if(suppressScrollUpdates) return;
    if(scrollTicking) return;
    scrollTicking = true;
    window.requestAnimationFrame(function(){
      updateActiveFromScroll();
      scrollTicking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("touchstart", function(){
    suppressScrollUpdates = false;
    clearTimeout(suppressTimer);
  }, { passive: true });

  function render(){
    root.innerHTML = "";
    var visibleCats = [];
    var sectionIds = [];

    masterData.forEach(function(cat){
      visibleCats.push(cat);

      var section = document.createElement("section");
      section.className = "cat-section" + (cat.id === "osusume" ? " custom-section" : "");
      section.id = cat.id;
      sectionIds.push(cat.id);

      var heading = document.createElement("div");
      heading.className = "cat-heading";
      heading.textContent = cat.id === "osusume" ? "本日のおすすめ（追加メニュー）" : cat.cat;
      section.appendChild(heading);

      if(cat.items.length === 0){
        var hint = document.createElement("div");
        hint.className = "empty-note";
        hint.style.padding = "16px 4px";
        hint.textContent = cat.id === "osusume" ? "上のフォームから追加できます" : "登録されている商品がありません";
        section.appendChild(hint);
      } else if(NO_TINT_CATS.indexOf(cat.cat) !== -1){
        cat.items.forEach(function(it){
          section.appendChild(buildRow(cat.id, it));
        });
      } else {
        var priceColorMap = {};
        var nextTint = 0;
        cat.items.forEach(function(it){
          if(!(it.p in priceColorMap)){
            priceColorMap[it.p] = nextTint % 5;
            nextTint++;
          }
          var row = buildRow(cat.id, it);
          row.classList.add("price-tint-" + priceColorMap[it.p]);
          section.appendChild(row);
        });
      }

      root.appendChild(section);
    });

    buildTabs(visibleCats);

    renderBill();
    currentSectionIds = sectionIds;
    if(typeof positionTabs === "function") positionTabs();
    updateActiveFromScroll();
  }

  function addCustomItem(){
    var nameInput = document.getElementById("customName");
    var priceInput = document.getElementById("customPrice");
    var errorEl = document.getElementById("customError");
    var name = nameInput.value.trim();
    var price = parseInt(priceInput.value, 10);

    if(!name){
      errorEl.textContent = "メニュー名を入力してください";
      nameInput.focus();
      return;
    }
    if(isNaN(price) || price < 0){
      errorEl.textContent = "値段を数字で入力してください";
      priceInput.focus();
      return;
    }

    errorEl.textContent = "";
    var id = addItemToOsusume(name, price);
    state.qty[id] = 1;
    saveState();
    nameInput.value = "";
    priceInput.value = "";
    render();
    nameInput.focus();
  }

  function changeQty(id, delta){
    var cur = state.qty[id] || 0;
    var next = Math.max(0, cur + delta);
    if(next === 0){ delete state.qty[id]; } else { state.qty[id] = next; }
    saveState();
    render();
  }

  function allItemsFlat(){
    var flat = [];
    masterData.forEach(function(cat){ cat.items.forEach(function(it){ flat.push(it); }); });
    return flat;
  }

  function renderBill(){
    var flat = allItemsFlat();
    var count = 0, total = 0;
    flat.forEach(function(it){
      var q = state.qty[it.id] || 0;
      if(q > 0){ count += q; total += priceFor(it.p) * q; }
    });
    if(state.manualTotal != null) total = state.manualTotal;
    document.getElementById("billCount").textContent = count + "点";
    var amountEl = document.getElementById("billAmount");
    amountEl.textContent = yen(total) + " ";
    var small = document.createElement("small");
    small.textContent = state.manualTotal != null ? "編集済み" : (state.taxIncl ? "税込" : "税抜");
    amountEl.appendChild(small);
    renderReceipt();
  }

  function renderReceipt(){
    var flat = allItemsFlat();
    var body = document.getElementById("receiptBody");
    body.innerHTML = "";
    var calculatedTotal = 0;

    var selected = [];
    flat.forEach(function(it){
      var q = state.qty[it.id] || 0;
      if(q > 0){
        var sub = priceFor(it.p) * q;
        calculatedTotal += sub;
        selected.push({ n: it.n, q: q, sub: sub });
      }
    });

    selected.sort(function(a, b){ return b.sub - a.sub; });

    if(selected.length === 0){
      var e = document.createElement("div");
      e.className = "empty-note";
      e.textContent = "まだ注文が選ばれていません";
      body.appendChild(e);
    } else {
      selected.forEach(function(s){
        var row = document.createElement("div");
        row.className = "receipt-row";
        row.innerHTML =
          '<span class="rn">' + esc(s.n) + '</span>' +
          '<span class="rq">×' + s.q + '</span>' +
          '<span class="rp">' + yen(s.sub) + '</span>';
        body.appendChild(row);
      });
    }
    lastCalculatedTotal = calculatedTotal;
    var effectiveTotal = (state.manualTotal != null) ? state.manualTotal : calculatedTotal;
    document.getElementById("receiptTotal").textContent = yen(effectiveTotal);
    var noteEl = document.getElementById("receiptTotalNote");
    if(state.manualTotal != null){
      noteEl.textContent = "自動計算 " + yen(calculatedTotal) + " から編集済み・タップで解除";
      noteEl.style.display = "block";
    } else {
      noteEl.textContent = "";
      noteEl.style.display = "none";
    }
    lastReceiptTotal = effectiveTotal;
    lastReceiptItems = selected;
    updateSplitDisplay();
    updateChangeDisplay();
  }

  var lastCalculatedTotal = 0;

  function updateChangeDisplay(){

      el.textContent = "お釣り —";

    var diff = receivedAmount - lastReceiptTotal;

  function formatHistoryDate(iso){
    var d = new Date(iso);
    var mm = d.getMonth() + 1, dd = d.getDate();
    var hh = ("0" + d.getHours()).slice(-2), mi = ("0" + d.getMinutes()).slice(-2);
    return mm + "/" + dd + " " + hh + ":" + mi;
  }

  function finalizeCheckout(){
    if(lastReceiptItems.length === 0){
      resetAll();
      closePanel();
      return;
    }
    var entry = {
      id: "h" + Date.now(),
      date: new Date().toISOString(),
      items: lastReceiptItems.map(function(s){ return { n: s.n, q: s.q, sub: s.sub }; }),
      total: lastReceiptTotal,
      splitCount: state.splitCount,
      received: receivedAmount,
      change: (receivedAmount != null) ? (receivedAmount - lastReceiptTotal) : null
    };
    var list = loadHistory();
    list.unshift(entry);
    saveHistory(list);

    receivedAmount = null;
    document.getElementById("receivedInput").value = "";
    resetAll();
    closePanel();
  }

  var themeBtn = document.getElementById("themeToggle");
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    themeBtn.textContent = state.theme === "dark" ? "☀️" : "🌙";
  }
  applyTheme();
  themeBtn.addEventListener("click", function(){
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme();
    saveState();
  });

  var receipt = document.getElementById("receipt");
  var historyPanel = document.getElementById("historyPanel");
  var importPanel = document.getElementById("importPanel");
  var backdrop = document.getElementById("backdrop");
  var activePanel = null;

  function openPanel(el){
    activePanel = el;
    el.classList.add("open");
    backdrop.classList.add("open");
  }
  function closePanel(){
    if(activePanel) activePanel.classList.remove("open");
    backdrop.classList.remove("open");
    activePanel = null;
  }
  function openReceipt(){ openPanel(receipt); }
  document.getElementById("openReceipt").addEventListener("click", openReceipt);
  document.getElementById("closeReceipt").addEventListener("click", closePanel);

  var totalEditForm = document.getElementById("totalEditForm");
  var totalEditInput = document.getElementById("totalEditInput");
  document.getElementById("totalEditBtn").addEventListener("click", function(){
    totalEditInput.value = (state.manualTotal != null) ? state.manualTotal : lastCalculatedTotal;
    totalEditForm.style.display = "flex";
    totalEditInput.focus();
    totalEditInput.select();
  });
  document.getElementById("receiptTotalNote").addEventListener("click", function(){
    state.manualTotal = null;
    saveState();
    renderBill();
  });
  document.getElementById("totalEditCancel").addEventListener("click", function(){
    totalEditForm.style.display = "none";
  });
  document.getElementById("totalEditSave").addEventListener("click", function(){
    var v = parseInt(totalEditInput.value, 10);
    if(isNaN(v) || v < 0){
      totalEditInput.focus();
      return;
    }
    state.manualTotal = v;
    saveState();
    totalEditForm.style.display = "none";
    renderBill();
  });
  document.getElementById("historyBtn").addEventListener("click", function(){
    renderHistoryList();
    openPanel(historyPanel);
  });
  document.getElementById("closeHistory").addEventListener("click", closePanel);
  document.getElementById("closeImport").addEventListener("click", closePanel);
  document.getElementById("importSubmitBtn").addEventListener("click", function(){
    importMasterFromText(document.getElementById("importTextarea").value);
  });
  document.getElementById("importFileBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){ importMasterFromText(reader.result); };
    reader.readAsText(file);
    e.target.value = "";
  });
  backdrop.addEventListener("click", closePanel);

  // Two-tap confirmation for destructive actions: the button flips to a
  // "本当に◯◯？" state and reverts on its own after a few seconds if not
  // tapped again. Avoids window.confirm(), which the artifact sandbox
  // blocks (calling it silently threw and aborted the handler).
  function armConfirmButton(btn, confirmLabel, onConfirm){
    var normalLabel = btn.textContent;
    var pending = false;
    var timer = null;
    btn.addEventListener("click", function(){
      if(!pending){
        pending = true;
        btn.textContent = confirmLabel;
        btn.classList.add("confirming");
        timer = setTimeout(function(){
          pending = false;
          btn.textContent = normalLabel;
          btn.classList.remove("confirming");
        }, 3000);
        return;
      }
      clearTimeout(timer);
      pending = false;
      btn.textContent = normalLabel;
      btn.classList.remove("confirming");
      onConfirm();
    });
  }

  armConfirmButton(document.getElementById("clearHistoryBtn"), "本当に削除？", function(){
    saveHistory([]);
    renderHistoryList();
  });

  function resetAll(){
    state.qty = {};
    state.manualTotal = null;
    saveState();
    render();
  }
  document.getElementById("resetBtnBottom").addEventListener("click", function(){
    if(lastReceiptItems.length === 0){
      resetAll();
      closePanel();
      return;
    }
    finalizeCheckout();
  });

  function positionTabs(){
    var headerEl = document.querySelector("header");
    var head = document.querySelector(".sticky-head");
    var headerH = headerEl ? headerEl.getBoundingClientRect().height : 0;
    head.style.top = headerH + "px";
    var h = headerH + head.getBoundingClientRect().height;
    document.querySelector("main").style.marginTop = h + "px";
    Array.prototype.forEach.call(document.querySelectorAll(".cat-section"), function(sec){
      sec.style.scrollMarginTop = (h + 8) + "px";
    });
  }
  var lastWidth = window.innerWidth;
  window.addEventListener("resize", function(){
    if(window.innerWidth !== lastWidth){
      lastWidth = window.innerWidth;
      positionTabs();
    }
  });
  window.addEventListener("load", positionTabs);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(positionTabs);
  }

  render();
  positionTabs();
})();
</script>
</body>
</html>
